<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맥주 마시기</title>
  <style>
    @font-face {
      font-family: 'SlowGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/neurimboGothicRegular.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --green: #43f000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--green);
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: 28px;
      border: 4px solid #e4e4e4;
      place-items: center;
      overflow: hidden;
      background: var(--green);
    }

    .page.page-enter-slide {
      animation: page-slide-in 650ms cubic-bezier(0.22, 0.8, 0.26, 1) both;
    }

    @keyframes page-slide-in {
      from {
        transform: translateX(100%);
      }

      to {
        transform: translateX(0);
      }
    }

    .nav-button {
      position: absolute;
      top: 28px;
      z-index: 20;
      display: block;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav-button.left {
      left: 28px;
    }

    .nav-button.right {
      right: 28px;
    }

    .nav-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nav-button:hover {
      transform: scale(1.06);
    }

    .nav-button:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

    .camera-frame {
      position: relative;
      width: min(70vw, 850px);
      aspect-ratio: 5 / 3;
      overflow: visible;
      background: transparent;
    }

    .camera-frame.is-shredding {
      visibility: hidden;
    }

    .camera-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      visibility: hidden;
      background: #fff;
    }

    .wave-camera {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      transform: scaleX(-1) scaleY(var(--wave-scale-y, 1));
      transform-origin: center;
      pointer-events: none;
    }

    .person-redness {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: fill;
      transform: scaleX(-1) scaleY(var(--wave-scale-y, 1));
      transform-origin: center;
      mix-blend-mode: multiply;
      opacity: 0.95;
    }

    .glass-overlay {
      position: absolute;
      z-index: 3;
      display: block;
      width: clamp(171px, 24.75vw, 338px);
      height: auto;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      transform: translate(-50%, -50%) rotate(var(--glass-rotation, 0deg)) scaleX(var(--glass-flip, 1));
      transform-origin: center;
      transition: opacity 160ms ease, left 90ms linear, top 90ms linear, width 120ms ease, transform 120ms ease;
    }

    .glass-overlay.is-visible {
      opacity: 1;
    }

    .thought-wave {
      position: absolute;
      z-index: 6;
      top: 8%;
      left: 50%;
      display: none;
      width: min(90%, 720px);
      justify-content: center;
      align-items: center;
      gap: 0.02em;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .thought-wave.is-visible {
      display: flex;
    }

    .thought-wave-letter {
      display: inline-block;
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
      font-size: 22px;
      line-height: 1;
      white-space: pre;
      animation: thought-wave 1.4s ease-in-out infinite;
      animation-delay: calc(var(--letter-index) * 80ms);
    }

    @keyframes thought-wave {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .instruction-area {
      position: absolute;
      z-index: 6;
      inset: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: 82px 28px 24px;
      pointer-events: none;
    }

    .instruction-text {
      position: relative;
      z-index: 1;
      width: 100%;
      margin: 0;
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .camera-status {
      position: absolute;
      bottom: 14px;
      left: 50%;
      z-index: 5;
      margin: 0;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.2;
      transform: translateX(-50%);
    }

    .camera-status:empty {
      display: none;
    }

    .shred-scene {
      position: absolute;
      inset: 0;
      z-index: 10;
      visibility: hidden;
      pointer-events: none;
    }

    .shred-scene.is-visible {
      visibility: visible;
    }

    .shred-intact-clip,
    .shred-slices-clip {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .shred-intact-clip {
      top: 0;
      z-index: 1;
    }

    .shred-slices-clip {
      z-index: 1;
    }

    .shred-intact,
    .shred-slices {
      position: absolute;
      overflow: visible;
    }

    .shred-intact {
      z-index: 1;
      display: block;
      max-width: none;
      transform: translateY(0) scaleX(-1);
      transform-origin: center top;
      pointer-events: none;
    }

    .shred-intact.is-moving {
      animation: shred-screen-pass var(--pass-duration, 4800ms) linear forwards;
    }

    .shred-slices {
      visibility: hidden;
      transform: translateY(0) scaleX(-1);
      transform-origin: center;
    }

    .shred-slices.is-visible.is-moving {
      visibility: visible;
      animation: shred-screen-pass var(--pass-duration, 4800ms) linear forwards;
    }

    .shred-slice {
      position: absolute;
      top: 0;
      display: block;
      max-width: none;
      transform-origin: center;
      opacity: 1;
    }

    .shred-slice.is-dropping {
      animation: shred-slice-drop 4200ms linear forwards;
    }

    @keyframes shred-screen-pass {
      0% {
        transform: translateY(0) scaleX(-1);
      }

      100% {
        transform: translateY(var(--screen-distance, 700px)) scaleX(-1);
      }
    }

    @keyframes shred-slice-drop {
      0% {
        transform: scaleY(var(--slice-scale-y, 1)) translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: scaleY(var(--slice-scale-y, 1)) translateY(var(--drop-distance, 700px));
        opacity: 0;
      }
    }

    .shredder {
      position: absolute;
      top: 60vh;
      left: 37vw;
      z-index: 2;
      width: min(56vw, 560px);
      height: auto;
      opacity: 0;
      transform: translate(-50%, -90px);
      transition: opacity 180ms ease, transform 360ms cubic-bezier(0.2, 0.8, 0.25, 1);
    }

    .shred-scene.is-visible .shredder {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .shredder-image {
      display: block;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .late-shred-stage {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      overflow: hidden;
      background: var(--green);
      pointer-events: auto;
      transition: background-color var(--late-shred-transform-duration, 1800ms) ease;
    }

    .late-shred-stage.is-visible {
      display: block;
    }

    #lateShredPieces {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .late-shred-piece {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      max-width: none;
      overflow: hidden;
      border-radius: 0;
      background: transparent;
      pointer-events: auto;
      cursor: pointer;
      z-index: 1;
      transform-origin: center;
      will-change: transform;
      transition: none;
    }

    .late-shred-bean {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      display: block;
      width: 110px;
      height: auto;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center bottom;
      transition: none;
    }

    .late-shred-image {
      display: block;
      width: 100%;
      height: 100%;
      opacity: 1;
      transition: opacity var(--late-shred-transform-duration, 1800ms) ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .late-shred-stage.is-transforming {
      background: #ff0000;
    }

    .late-shred-stage.is-transforming .late-shred-piece {
      width: 85px !important;
      height: 54px !important;
      border-radius: 50%;
      background: var(--green);
      transition: opacity var(--late-shred-transform-duration, 1800ms) ease, transform var(--late-shred-transform-duration, 1800ms) ease, width var(--late-shred-transform-duration, 1800ms) ease, height var(--late-shred-transform-duration, 1800ms) ease, border-radius var(--late-shred-transform-duration, 1800ms) ease, background-color var(--late-shred-transform-duration, 1800ms) ease;
    }

    .late-shred-stage.is-transforming .late-shred-piece.is-removed {
      opacity: 0 !important;
      pointer-events: none;
    }

    .late-shred-stage.is-transforming .late-shred-image {
      opacity: 1;
    }

    .late-shred-stage.is-transforming .late-shred-bean {
      opacity: 1;
      transition: opacity var(--late-shred-transform-duration, 1800ms) ease, transform var(--late-shred-transform-duration, 1800ms) ease;
    }

    .late-shred-stage.is-transforming .late-shred-bean.is-removed {
      opacity: 0 !important;
      pointer-events: none;
    }

    .late-shred-stage.is-wave-active {
      overflow: visible;
      background: transparent;
    }

    .late-shred-stage.is-wave-active #lateShredPieces {
      visibility: hidden;
    }

    .late-horizontal-wave {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: none;
      overflow: visible;
      pointer-events: none;
    }

    .late-horizontal-wave.is-visible {
      display: block;
    }

    .late-horizontal-wave-strip {
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
      background-color: #ff0000;
      background-repeat: no-repeat;
      will-change: transform;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px;
      }

      .nav-button {
        top: 18px;
      }

      .nav-button.left {
        left: 18px;
      }

      .nav-button.right {
        right: 18px;
      }

      .camera-frame {
        width: min(92vw, 850px);
      }

      .shredder {
        width: min(72vw, 560px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <button class="nav-button left" type="button" aria-label="2.html로 돌아가기">
      <img src="./button_l.png" alt="">
    </button>

    <button class="nav-button right" type="button" aria-label="다음 페이지로 이동">
      <img src="./button_r.png" alt="">
    </button>

    <section class="camera-frame" aria-label="얼굴과 손 인식 카메라">
      <video id="cameraVideo" class="camera-video" autoplay muted playsinline></video>
      <canvas id="waveCamera" class="wave-camera" aria-hidden="true"></canvas>
      <canvas id="personRedness" class="person-redness" aria-hidden="true"></canvas>
      <img id="glassOverlay" class="glass-overlay" src="./beer/glass.png" alt="손에 든 유리잔">
      <div id="thoughtWave" class="thought-wave" aria-label="입력한 생각"></div>
      <p id="cameraStatus" class="camera-status" aria-live="polite">카메라를 준비하는 중...</p>
    </section>

    <div class="instruction-area">
      <p class="instruction-text">Make A Fist!</p>
    </div>

    <div id="shredScene" class="shred-scene" aria-hidden="true">
      <div id="shredIntactClip" class="shred-intact-clip">
        <canvas id="shredIntact" class="shred-intact" aria-hidden="true"></canvas>
      </div>
      <div id="shredSlicesClip" class="shred-slices-clip">
        <div id="shredSlices" class="shred-slices"></div>
      </div>
      <div class="shredder">
        <img class="shredder-image" src="./group.gif" alt="">
      </div>
      <div id="lateShredStage" class="late-shred-stage" aria-hidden="true">
        <div id="lateShredPieces" aria-hidden="true"></div>
        <div id="lateHorizontalWave" class="late-horizontal-wave" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script type="module">
    const cameraVideo = document.querySelector('#cameraVideo');
    const cameraFrame = document.querySelector('.camera-frame');
    const waveCamera = document.querySelector('#waveCamera');
    const waveCameraContext = waveCamera.getContext('2d');
    const personCameraSource = document.createElement('canvas');
    const personCameraSourceContext = personCameraSource.getContext('2d');
    const personVideoCanvas = document.createElement('canvas');
    const personVideoCanvasContext = personVideoCanvas.getContext('2d');
    const personMaskCanvas = document.createElement('canvas');
    const personMaskContext = personMaskCanvas.getContext('2d');
    const personRedness = document.querySelector('#personRedness');
    const personRednessContext = personRedness.getContext('2d');
    const personRednessSource = document.createElement('canvas');
    const personRednessSourceContext = personRednessSource.getContext('2d');
    const glassOverlay = document.querySelector('#glassOverlay');
    const thoughtWave = document.querySelector('#thoughtWave');
    const cameraStatus = document.querySelector('#cameraStatus');
    const backButton = document.querySelector('.nav-button.left');
    const forwardButton = document.querySelector('.nav-button.right');
    const page = document.querySelector('.page');
    const shredScene = document.querySelector('#shredScene');
    const shredIntactClip = document.querySelector('#shredIntactClip');
    const shredIntact = document.querySelector('#shredIntact');
    const shredIntactContext = shredIntact.getContext('2d');
    const shredSlicesClip = document.querySelector('#shredSlicesClip');
    const shredSlices = document.querySelector('#shredSlices');
    const shredder = document.querySelector('.shredder');
    const lateShredStage = document.querySelector('#lateShredStage');
    const lateShredPieces = document.querySelector('#lateShredPieces');
    const lateHorizontalWave = document.querySelector('#lateHorizontalWave');

    if (new URLSearchParams(window.location.search).get('enter') === 'slide') {
      page.classList.add('page-enter-slide');
    }

    const glassAssetUrl = `./beer/glass.png?v=${Date.now()}`;
    const glassSource = new Image();
    const drinkSound1 = new Audio('./sound/drink1.mp3');
    const drinkSound2 = new Audio('./sound/drink2.mp3');
    const drinkSound3 = new Audio('./sound/drink3.mp3');
    const eatingSoundUrls = [
      './sound/eatingsound.mp3',
      './sound/eatingsound2.mp3'
    ];
    const shredSound = new Audio('./sound/1.mp3');
    const shredSourceCanvas = document.createElement('canvas');
    const shredSourceContext = shredSourceCanvas.getContext('2d');
    drinkSound1.preload = 'auto';
    drinkSound2.preload = 'auto';
    drinkSound3.preload = 'auto';
    shredSound.preload = 'auto';
    glassOverlay.src = glassAssetUrl;

    const handModelUrl = './vendor/models/hand_landmarker.task';
    const faceModelUrl = './vendor/models/face_landmarker.task';
    const segmenterModelUrl = './vendor/models/selfie_segmenter.tflite';
    const wasmUrl = './vendor/mediapipe/wasm';
    const visionBundleUrl = './vendor/mediapipe/vision_bundle.mjs';

    let handLandmarker = null;
    let faceLandmarker = null;
    let imageSegmenter = null;
    let cameraStream = null;
    let lastVideoTime = -1;
    let animationFrameId = null;
    let fistFrameCount = 0;
    let drinkPoseFrames = 0;
    let drinkReleaseFrames = 0;
    let drinkGestureActive = false;
    let drinkCount = 0;
    let personMaskCategory = 0;
    let audioUnlocked = false;
    let shredderStarted = false;
    let motionCaptureStopped = false;
    let lateShredAnimationFrame = null;
    let lateShredObjects = [];
    let lateShredStageStarted = false;
    let lateShredFallComplete = false;
    let lateShredTransformStarted = false;
    let latePointer = null;
    let lateEllipseClickCount = 0;
    let lateShredNextPageTimer = null;
    let lateShredNextPageWaiting = false;
    let lateHorizontalWaveFrame = null;
    const lateShredTransformDuration = 1800;
    const latePointerForceMultiplier = 3;
    let glassCanvas = null;
    let glassBaseImageData = null;
    let beerBounds = null;

    const glassSizeScale = 2.25;
    const glassMinWidth = 76 * glassSizeScale;
    const glassMaxWidth = 150 * glassSizeScale;
    const maxDrinkCount = 7;
    const glassDrinkContactRatio = 0.30;
    const waveSliceCount = 96;
    const maxWaveAmplitude = 42;
    const wavePadding = 56;
    const thoughtText = (localStorage.getItem('thought-text') || '').trim();

    Array.from(thoughtText).forEach((character, index) => {
      const letter = document.createElement('span');
      letter.className = 'thought-wave-letter';
      letter.textContent = character;
      letter.style.setProperty('--letter-index', index);
      thoughtWave.appendChild(letter);
    });

    if (thoughtText) {
      thoughtWave.classList.add('is-visible');
    }

    glassSource.addEventListener('load', prepareGlassImage);

    backButton.addEventListener('click', () => {
      window.location.href = './2.html';
    });

    forwardButton.addEventListener('click', () => {
      window.history.forward();
    });

    lateShredStage.addEventListener('pointermove', stirLateShredPieces);

    function setStatus(message) {
      cameraStatus.textContent = message;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function playLateEllipseSound(onPlaybackUnavailable) {
      const sound = new Audio(eatingSoundUrls[Math.floor(Math.random() * eatingSoundUrls.length)]);
      sound.preload = 'auto';
      sound.play().catch(() => {
        // 브라우저가 오디오를 막아도 클릭 인터랙션은 계속 진행합니다.
        if (onPlaybackUnavailable) {
          onPlaybackUnavailable();
        }
      });
      return sound;
    }

    function getLateElementRotation(element) {
      const transform = window.getComputedStyle(element).transform;

      if (!transform || transform === 'none') {
        return 0;
      }

      const values = transform.match(/matrix(?:3d)?\(([^)]+)\)/)?.[1]
        .split(',')
        .map(Number);

      if (!values || values.some(Number.isNaN)) {
        return 0;
      }

      return Math.atan2(values[1], values[0]);
    }

    function drawLateShredWaveSnapshot() {
      const width = Math.max(1, Math.round(lateShredStage.clientWidth));
      const height = Math.max(1, Math.round(lateShredStage.clientHeight));
      const snapshotCanvas = document.createElement('canvas');
      const snapshotContext = snapshotCanvas.getContext('2d');

      snapshotCanvas.width = width;
      snapshotCanvas.height = height;
      snapshotContext.fillStyle = '#ff0000';
      snapshotContext.fillRect(0, 0, width, height);

      const stageRect = lateShredStage.getBoundingClientRect();
      const drawableItems = [...lateShredPieces.children]
        .filter((element) => element.isConnected && Number.parseFloat(window.getComputedStyle(element).opacity) > 0)
        .sort((first, second) => {
          const firstZIndex = Number.parseInt(window.getComputedStyle(first).zIndex, 10) || 0;
          const secondZIndex = Number.parseInt(window.getComputedStyle(second).zIndex, 10) || 0;
          return firstZIndex - secondZIndex;
        });

      drawableItems.forEach((element) => {
        const elementRect = element.getBoundingClientRect();
        const elementWidth = element.offsetWidth;
        const elementHeight = element.offsetHeight;

        if (!elementWidth || !elementHeight) {
          return;
        }

        const centerX = elementRect.left - stageRect.left + elementRect.width / 2;
        const centerY = elementRect.top - stageRect.top + elementRect.height / 2;
        const rotation = getLateElementRotation(element);

        snapshotContext.save();
        snapshotContext.translate(centerX, centerY);
        snapshotContext.rotate(rotation);

        if (element.matches('.late-shred-piece')) {
          snapshotContext.fillStyle = '#43f000';
          snapshotContext.fillRect(-elementWidth / 2, -elementHeight / 2, elementWidth, elementHeight);

          const pieceCanvas = element.querySelector('canvas');
          if (pieceCanvas) {
            snapshotContext.drawImage(
              pieceCanvas,
              -elementWidth / 2,
              -elementHeight / 2,
              elementWidth,
              elementHeight
            );
          }
        } else if (element.matches('.late-shred-bean') && element.complete && element.naturalWidth) {
          snapshotContext.drawImage(
            element,
            -elementWidth / 2,
            -elementHeight / 2,
            elementWidth,
            elementHeight
          );
        }

        snapshotContext.restore();
      });

      return {
        imageUrl: snapshotCanvas.toDataURL('image/png'),
        width,
        height
      };
    }

    function finishLateHorizontalWave() {
      lateHorizontalWaveFrame = null;
      lateHorizontalWave.classList.remove('is-visible');
      lateHorizontalWave.replaceChildren();
      lateShredStage.classList.remove('is-wave-active');
    }

    function startLateHorizontalWave() {
      const snapshot = drawLateShredWaveSnapshot();

      if (!snapshot) {
        return;
      }

      if (lateHorizontalWaveFrame !== null) {
        window.cancelAnimationFrame(lateHorizontalWaveFrame);
        finishLateHorizontalWave();
      }

      const rowCount = Math.max(18, Math.min(32, Math.round(snapshot.height / 28)));
      const rowHeight = snapshot.height / rowCount;
      const strips = [];

      for (let rowIndex = 0; rowIndex < rowCount; rowIndex += 1) {
        const top = rowIndex * rowHeight;
        const strip = document.createElement('div');
        strip.className = 'late-horizontal-wave-strip';
        strip.style.top = `${top}px`;
        strip.style.height = `${rowHeight + 1}px`;
        strip.style.backgroundImage = `url(${snapshot.imageUrl})`;
        strip.style.backgroundSize = `${snapshot.width}px ${snapshot.height}px`;
        strip.style.backgroundPosition = `0 -${top}px`;
        lateHorizontalWave.appendChild(strip);
        strips.push(strip);
      }

      lateShredStage.classList.add('is-wave-active');
      lateHorizontalWave.classList.add('is-visible');

      const startedAt = performance.now();
      const duration = 820;
      const amplitude = Math.min(44, 12 + lateEllipseClickCount * 4);

      const animateWave = (timestamp) => {
        const progress = Math.min(1, (timestamp - startedAt) / duration);
        const envelope = Math.sin(progress * Math.PI);
        const phase = progress * Math.PI * 4.6;

        strips.forEach((strip, rowIndex) => {
          const rowPhase = (rowIndex / rowCount) * Math.PI * 2.6;
          const offsetX = Math.sin(phase + rowPhase) * amplitude * envelope;
          strip.style.transform = `translate3d(${offsetX}px, 0, 0)`;
        });

        if (progress < 1) {
          lateHorizontalWaveFrame = window.requestAnimationFrame(animateWave);
          return;
        }

        finishLateHorizontalWave();
      };

      lateHorizontalWaveFrame = window.requestAnimationFrame(animateWave);
    }

    function handleLateEllipseClick(event) {
      if (!lateShredTransformStarted || event.currentTarget.classList.contains('is-removed')) {
        return;
      }

      event.stopPropagation();
      lateEllipseClickCount += 1;
      event.currentTarget.remove();
      startLateHorizontalWave();

      let navigateAfterSound = null;
      if (lateEllipseClickCount >= 8 && !lateShredNextPageWaiting) {
        lateShredNextPageWaiting = true;
        navigateAfterSound = () => {
          if (lateShredNextPageTimer !== null) {
            return;
          }

          lateShredNextPageTimer = window.setTimeout(() => {
            window.location.href = './2.html?stage=canclose';
          }, 1000);
        };
      }

      const sound = playLateEllipseSound(navigateAfterSound);

      if (navigateAfterSound) {
        sound.addEventListener('ended', navigateAfterSound, { once: true });
        sound.addEventListener('error', navigateAfterSound, { once: true });
        if (sound.ended) {
          navigateAfterSound();
        }
      }
    }

    function createLateShredBeans(targetEllipseY) {
      const beanCount = Math.max(5, Math.round(lateShredObjects.length * 0.2));
      const beanWidth = 110;
      const beanHeight = beanWidth * (292 / 440);
      const beanBottomY = targetEllipseY + 54;
      const beanTargetY = beanBottomY - beanHeight;
      const maxBeanLeft = Math.max(10, lateShredStage.clientWidth - beanWidth - 10);

      for (let index = 0; index < beanCount; index += 1) {
        const bean = document.createElement('img');
        const targetX = randomBetween(10, maxBeanLeft);
        const targetRotation = randomBetween(-18, 18);
        const startY = beanTargetY - randomBetween(70, 150);

        bean.className = 'late-shred-bean';
        bean.src = './bean.png';
        bean.alt = '';
        bean.style.zIndex = Math.random() < 0.5 ? '0' : '2';
        bean.style.transform = `translate3d(${targetX}px, ${startY}px, 0) rotate(${targetRotation}deg)`;
        bean.addEventListener('click', handleLateEllipseClick);
        lateShredPieces.appendChild(bean);

        window.requestAnimationFrame(() => {
          bean.style.transform = `translate3d(${targetX}px, ${beanTargetY}px, 0) rotate(${targetRotation}deg)`;
        });
      }
    }

    function animateLateShredPieces(timestamp) {
      let activeObjects = false;
      const screenWidth = lateShredStage.clientWidth;

      if (latePointer && lateShredFallComplete && !lateShredTransformStarted) {
        const rawDeltaX = latePointer.x - latePointer.previousX;
        const rawDeltaY = latePointer.y - latePointer.previousY;
        const pointerDeltaX = Math.max(-24, Math.min(24, rawDeltaX));
        const pointerDeltaY = Math.max(-24, Math.min(24, rawDeltaY));
        const pointerMovement = Math.hypot(pointerDeltaX, pointerDeltaY);

        latePointer.previousX = latePointer.x;
        latePointer.previousY = latePointer.y;

        if (pointerMovement > 0.01) {
          const radius = Math.max(100, Math.min(170, lateShredStage.clientWidth * 0.13));
          const pointerSpeedRatio = Math.min(1.5, pointerMovement / 16);

          lateShredObjects.forEach((shredObject) => {
            const centerX = shredObject.x + shredObject.width / 2;
            const centerY = shredObject.y + shredObject.height / 2;
            const distance = Math.hypot(centerX - latePointer.x, centerY - latePointer.y);

            if (distance > radius) {
              return;
            }

            const forceRatio = 1 - distance / radius;
            const proximityForce = forceRatio * forceRatio;
            const safeDistance = Math.max(distance, 1);
            const radialForce = 12 * latePointerForceMultiplier
              * (0.6 + pointerSpeedRatio) * proximityForce;

            shredObject.vx += ((centerX - latePointer.x) / safeDistance) * radialForce;
            shredObject.vy += ((centerY - latePointer.y) / safeDistance) * radialForce;
            shredObject.angularVelocity += (pointerDeltaX - pointerDeltaY) * 0.135 * latePointerForceMultiplier * forceRatio;
            shredObject.startAt = timestamp;
            shredObject.lastTime = timestamp;
            shredObject.settled = false;
            shredObject.element.style.opacity = '1';
            activeObjects = true;
          });
        }
      }

      lateShredObjects.forEach((shredObject) => {
        if (shredObject.settled) {
          return;
        }

        activeObjects = true;

        if (timestamp < shredObject.startAt) {
          shredObject.element.style.opacity = '0';
          return;
        }

        if (shredObject.lastTime === null) {
          shredObject.lastTime = timestamp;
          shredObject.element.style.opacity = '1';
          shredObject.element.style.transform = `translate3d(${shredObject.x}px, ${shredObject.y}px, 0) rotate(${shredObject.rotation}deg)`;
          return;
        }

        const deltaTime = Math.min((timestamp - shredObject.lastTime) / 1000, 0.032);
        shredObject.lastTime = timestamp;
        shredObject.vy += shredObject.gravity * deltaTime;
        shredObject.x += shredObject.vx * deltaTime;
        shredObject.y += shredObject.vy * deltaTime;
        shredObject.rotation += shredObject.angularVelocity * deltaTime;

        if (shredObject.x < 0 || shredObject.x > screenWidth - shredObject.width) {
          shredObject.x = Math.min(
            Math.max(0, shredObject.x),
            Math.max(0, screenWidth - shredObject.width)
          );
          shredObject.vx *= -0.45;
        }

        if (shredObject.y >= shredObject.floorY) {
          shredObject.y = shredObject.floorY;

          if (Math.abs(shredObject.vy) > 70 && shredObject.bounceCount < 4) {
            shredObject.vy = -shredObject.vy * shredObject.restitution;
            shredObject.vx *= 0.72;
            shredObject.angularVelocity *= 0.7;
            shredObject.bounceCount += 1;
          } else {
            shredObject.vy = 0;
            shredObject.vx *= Math.pow(0.14, deltaTime);
            shredObject.angularVelocity *= Math.pow(0.08, deltaTime);

            if (Math.abs(shredObject.vx) < 2 && Math.abs(shredObject.angularVelocity) < 3) {
              shredObject.vx = 0;
              shredObject.angularVelocity = 0;
              shredObject.settled = true;
            }
          }
        }

        shredObject.element.style.opacity = '1';
        shredObject.element.style.transform = `translate3d(${shredObject.x}px, ${shredObject.y}px, 0) rotate(${shredObject.rotation}deg)`;
      });

      if (!lateShredFallComplete && lateShredObjects.length > 0
        && lateShredObjects.every((shredObject) => shredObject.settled)) {
        lateShredFallComplete = true;
      }

      if (activeObjects) {
        lateShredAnimationFrame = window.requestAnimationFrame(animateLateShredPieces);
      } else {
        lateShredAnimationFrame = null;
      }
    }

    function stirLateShredPieces(event) {
      if (!lateShredStageStarted || !lateShredFallComplete || lateShredTransformStarted || !lateShredObjects.length) {
        return;
      }

      const stageRect = lateShredStage.getBoundingClientRect();
      const pointerX = event.clientX - stageRect.left;
      const pointerY = event.clientY - stageRect.top;

      if (!latePointer) {
        latePointer = {
          x: pointerX,
          y: pointerY,
          previousX: pointerX,
          previousY: pointerY
        };
      } else {
        latePointer.x = pointerX;
        latePointer.y = pointerY;
      }

      if (lateShredAnimationFrame === null) {
        lateShredAnimationFrame = window.requestAnimationFrame(animateLateShredPieces);
      }
    }

    function startLateShredTransform() {
      if (lateShredTransformStarted || !lateShredObjects.length) {
        return;
      }

      lateShredTransformStarted = true;
      lateShredStage.style.setProperty('--late-shred-transform-duration', `${lateShredTransformDuration}ms`);
      lateShredStage.classList.add('is-transforming');
      const targetEllipseY = Math.max(0, lateShredStage.clientHeight * 0.9 - 54);
      createLateShredBeans(targetEllipseY);

      lateShredObjects.forEach((shredObject) => {
        shredObject.settled = true;
        shredObject.y = targetEllipseY;
        shredObject.vx = 0;
        shredObject.vy = 0;
        shredObject.angularVelocity = 0;
        shredObject.element.style.opacity = '1';
        if (Math.random() < 0.3) {
          shredObject.element.classList.add('is-removed');
          window.setTimeout(() => {
            shredObject.element.remove();
          }, lateShredTransformDuration);
        }
      });

      window.requestAnimationFrame(() => {
        lateShredObjects.forEach((shredObject) => {
          shredObject.element.style.transform = `translate3d(${shredObject.x}px, ${shredObject.y}px, 0) rotate(${shredObject.rotation}deg)`;
        });
      });

      if (lateShredAnimationFrame !== null) {
        window.cancelAnimationFrame(lateShredAnimationFrame);
        lateShredAnimationFrame = null;
      }
    }

    function startLateShredStage() {
      if (lateShredStageStarted) {
        return;
      }

      lateShredStageStarted = true;
      lateShredFallComplete = false;
      lateEllipseClickCount = 0;
      lateShredNextPageTimer = null;
      lateShredNextPageWaiting = false;
      latePointer = null;
      lateShredStage.classList.add('is-visible');
      lateShredStage.setAttribute('aria-hidden', 'false');
      lateShredPieces.replaceChildren();

      const sourceSlices = [...shredSlices.querySelectorAll('.shred-slice')];
      const frameRect = cameraFrame.getBoundingClientRect();
      const frameWidth = frameRect.width;
      const frameHeight = frameRect.height;
      const screenHeight = lateShredStage.clientHeight;
      const displaySliceWidth = frameWidth / Math.max(1, sourceSlices.length);
      const sliceGap = Math.max(3, Math.min(6, frameWidth * 0.006));
      const stageWidth = lateShredStage.clientWidth;
      const spawnLeft = Math.max(0, (stageWidth - frameWidth) / 2);
      const startedAt = performance.now();

      lateShredObjects = sourceSlices.map((sourceSlice, sliceIndex) => {
        const piece = document.createElement('div');
        const pieceImage = document.createElement('canvas');
        const pieceContext = pieceImage.getContext('2d');
        pieceImage.width = sourceSlice.width;
        pieceImage.height = sourceSlice.height;
        pieceContext.drawImage(sourceSlice, 0, 0);
        piece.className = 'late-shred-piece';
        pieceImage.className = 'late-shred-image';
        piece.appendChild(pieceImage);

        const pieceWidth = Math.max(1, displaySliceWidth - sliceGap);
        const pieceHeight = frameHeight;
        const startX = Math.min(
          Math.max(0, spawnLeft + sliceIndex * displaySliceWidth + sliceGap / 2),
          Math.max(0, stageWidth - pieceWidth)
        );
        const startY = -pieceHeight;

        piece.style.width = `${pieceWidth}px`;
        piece.style.height = `${pieceHeight}px`;
        piece.style.opacity = '0';
        piece.style.transform = `translate3d(${startX}px, ${startY}px, 0)`;
        piece.addEventListener('click', handleLateEllipseClick);
        piece.addEventListener('click', startLateShredTransform);
        lateShredPieces.appendChild(piece);

        return {
          element: piece,
          width: pieceWidth,
          height: pieceHeight,
          x: startX,
          y: startY,
          vx: 0,
          vy: randomBetween(40, 140),
          rotation: randomBetween(-30, 30),
          angularVelocity: randomBetween(-120, 120),
          gravity: randomBetween(1450, 1750),
          restitution: randomBetween(0.28, 0.42),
          floorY: screenHeight * 0.9 - pieceHeight,
          startAt: startedAt + randomBetween(0, 900),
          lastTime: null,
          bounceCount: 0,
          settled: false
        };
      });

      if (lateShredAnimationFrame !== null) {
        window.cancelAnimationFrame(lateShredAnimationFrame);
      }
      lateShredAnimationFrame = window.requestAnimationFrame(animateLateShredPieces);
    }

    function isBeerPixel(red, green, blue, alpha) {
      return alpha > 40
        && red > 120
        && green > 65
        && blue < 135
        && red > blue * 1.45
        && green > blue * 1.2;
    }

    function prepareGlassImage() {
      const width = glassSource.naturalWidth;
      const height = glassSource.naturalHeight;

      if (!width || !height) {
        return;
      }

      glassCanvas = document.createElement('canvas');
      glassCanvas.width = width;
      glassCanvas.height = height;
      const context = glassCanvas.getContext('2d');
      context.drawImage(glassSource, 0, 0);
      glassBaseImageData = context.getImageData(0, 0, width, height);

      let minY = height;
      let maxY = 0;
      const pixels = glassBaseImageData.data;

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const pixelIndex = (y * width + x) * 4;
          if (!isBeerPixel(
            pixels[pixelIndex],
            pixels[pixelIndex + 1],
            pixels[pixelIndex + 2],
            pixels[pixelIndex + 3]
          )) {
            continue;
          }

          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y);
        }
      }

      beerBounds = minY < maxY ? { minY, maxY } : null;
    }

    function renderBeerLevel() {
      if (!glassCanvas || !glassBaseImageData || !beerBounds) {
        return;
      }

      if (drinkCount === 0) {
        glassOverlay.src = glassAssetUrl;
        return;
      }

      const width = glassCanvas.width;
      const height = glassCanvas.height;
      const imageData = new ImageData(
        new Uint8ClampedArray(glassBaseImageData.data),
        width,
        height
      );
      const pixels = imageData.data;
      const drinkRatio = Math.min(1, drinkCount / maxDrinkCount);
      const cutoffY = beerBounds.minY + (beerBounds.maxY - beerBounds.minY) * drinkRatio;

      for (let y = beerBounds.minY; y < cutoffY; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const pixelIndex = (y * width + x) * 4;
          if (isBeerPixel(
            pixels[pixelIndex],
            pixels[pixelIndex + 1],
            pixels[pixelIndex + 2],
            pixels[pixelIndex + 3]
          )) {
            pixels[pixelIndex + 3] = 0;
          }
        }
      }

      glassCanvas.getContext('2d').putImageData(imageData, 0, 0);
      glassOverlay.src = glassCanvas.toDataURL('image/png');
    }

    function unlockDrinkSound() {
      if (audioUnlocked) {
        return;
      }

      const unlock = (audio) => {
        audio.muted = true;
        return audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          audio.muted = false;
        }).catch(() => {
          audio.muted = false;
        });
      };

      Promise.all([
        unlock(drinkSound1),
        unlock(drinkSound2),
        unlock(drinkSound3),
        unlock(shredSound)
      ]).finally(() => {
        audioUnlocked = true;
      });
    }

    function playIndependentAudio(audioTemplate, onEnded) {
      const audio = audioTemplate.cloneNode();
      audio.preload = 'auto';
      let finished = false;

      const finish = () => {
        if (finished) {
          return;
        }

        finished = true;
        audio.removeEventListener('ended', finish);
        audio.removeEventListener('error', finish);
        onEnded?.();
      };

      audio.addEventListener('ended', finish);
      audio.addEventListener('error', finish);
      audio.play().catch(() => {
        // 브라우저가 오디오를 막아도 다음 단계의 화면 전환은 멈추지 않습니다.
        finish();
      });
    }

    function playDrinkSound(onEnded) {
      const drinkAudio = Math.random() < 0.5 ? drinkSound1 : drinkSound2;

      playIndependentAudio(drinkAudio, () => {
        if (Math.random() < 0.1) {
          playIndependentAudio(drinkSound3, onEnded);
          return;
        }

        onEnded?.();
      });
    }

    document.addEventListener('pointerdown', unlockDrinkSound, { passive: true });

    glassSource.src = glassAssetUrl;

    function distance(first, second) {
      return Math.hypot(first.x - second.x, first.y - second.y);
    }

    function getFaceGeometry(face) {
      const mouthPoint = toFramePoint({
        x: (face[13].x + face[14].x) / 2,
        y: (face[13].y + face[14].y) / 2
      });
      const leftCheek = toFramePoint(face[234]);
      const rightCheek = toFramePoint(face[454]);
      const forehead = toFramePoint(face[10]);
      const chin = toFramePoint(face[152]);
      const faceWidth = distance(leftCheek, rightCheek);
      const faceHeight = distance(forehead, chin);

      return {
        mouthPoint,
        centerPoint: {
          x: (leftCheek.x + rightCheek.x) / 2,
          y: (forehead.y + chin.y) / 2
        },
        width: faceWidth,
        height: faceHeight
      };
    }

    function clearPersonRedness() {
      personRednessSourceContext.clearRect(
        0,
        0,
        personRednessSource.width,
        personRednessSource.height
      );
      personRednessContext.clearRect(0, 0, personRedness.width, personRedness.height);
    }

    function renderPersonOnlyCamera(segmentationResult, faceResult) {
      const categoryMask = segmentationResult?.categoryMask;
      const width = cameraVideo.videoWidth;
      const height = cameraVideo.videoHeight;

      if (!categoryMask || !width || !height) {
        return cameraVideo;
      }

      const maskWidth = categoryMask.width;
      const maskHeight = categoryMask.height;
      const maskData = categoryMask.getAsUint8Array();
      const detectedPersonCategory = inferPersonMaskCategory(maskData, maskWidth, maskHeight, faceResult);
      const maskImage = personMaskContext.createImageData(maskWidth, maskHeight);

      if (personMaskCanvas.width !== maskWidth || personMaskCanvas.height !== maskHeight) {
        personMaskCanvas.width = maskWidth;
        personMaskCanvas.height = maskHeight;
      }

      for (let index = 0; index < maskData.length; index += 1) {
        maskImage.data[index * 4 + 3] = maskData[index] === detectedPersonCategory ? 255 : 0;
      }

      personMaskContext.putImageData(maskImage, 0, 0);

      if (personVideoCanvas.width !== width || personVideoCanvas.height !== height) {
        personVideoCanvas.width = width;
        personVideoCanvas.height = height;
        personCameraSource.width = width;
        personCameraSource.height = height;
      }

      personVideoCanvasContext.globalCompositeOperation = 'source-over';
      personVideoCanvasContext.clearRect(0, 0, width, height);
      personVideoCanvasContext.drawImage(cameraVideo, 0, 0, width, height);
      personVideoCanvasContext.globalCompositeOperation = 'destination-in';
      personVideoCanvasContext.drawImage(personMaskCanvas, 0, 0, width, height);
      personVideoCanvasContext.globalCompositeOperation = 'source-over';

      personCameraSourceContext.fillStyle = '#fff';
      personCameraSourceContext.fillRect(0, 0, width, height);
      personCameraSourceContext.drawImage(personVideoCanvas, 0, 0, width, height);

      return personCameraSource;
    }

    function renderWavyCamera(timestamp, segmentationResult, faceResult) {
      const width = cameraVideo.videoWidth;
      const height = cameraVideo.videoHeight;

      if (!width || !height) {
        return;
      }

      const paddedHeight = height + wavePadding * 2;
      const sourceCanvas = renderPersonOnlyCamera(segmentationResult, faceResult);

      if (waveCamera.width !== width || waveCamera.height !== paddedHeight) {
        waveCamera.width = width;
        waveCamera.height = paddedHeight;
      }

      waveCamera.style.setProperty('--wave-scale-y', `${paddedHeight / height}`);
      waveCameraContext.clearRect(0, 0, width, paddedHeight);
      const drinkRatio = Math.min(1, drinkCount / maxDrinkCount);
      const amplitude = maxWaveAmplitude * drinkRatio;

      if (amplitude === 0) {
        waveCameraContext.drawImage(sourceCanvas, 0, wavePadding, width, height);
        return;
      }

      const phase = timestamp / 420;
      const sliceWidth = width / waveSliceCount;

      for (let sliceIndex = 0; sliceIndex < waveSliceCount; sliceIndex += 1) {
        const sourceX = sliceIndex * sliceWidth;
        const normalizedX = sliceIndex / waveSliceCount;
        const wave = Math.sin(normalizedX * Math.PI * 2.4 + phase)
          + Math.sin(normalizedX * Math.PI * 4.8 - phase * 0.72) * 0.22;
        const verticalOffset = wave * amplitude;

        waveCameraContext.drawImage(
          sourceCanvas,
          sourceX,
          0,
          sliceWidth + 1,
          height,
          sourceX,
          wavePadding + verticalOffset,
          sliceWidth + 1,
          height
        );
      }
    }

    function inferPersonMaskCategory(maskData, width, height, faceResult) {
      const face = faceResult?.faceLandmarks?.[0];
      if (!face) {
        return personMaskCategory;
      }

      const sampleLandmarks = [face[10], face[13], face[14], face[152], face[234], face[454]];
      const categoryCounts = new Map();

      sampleLandmarks.forEach((landmark) => {
        const x = Math.max(0, Math.min(width - 1, Math.round(landmark.x * (width - 1))));
        const y = Math.max(0, Math.min(height - 1, Math.round(landmark.y * (height - 1))));
        const category = maskData[y * width + x];
        categoryCounts.set(category, (categoryCounts.get(category) || 0) + 1);
      });

      personMaskCategory = [...categoryCounts.entries()]
        .sort((first, second) => second[1] - first[1])[0]?.[0] ?? personMaskCategory;
      return personMaskCategory;
    }

    function updatePersonRedness(segmentationResult, faceResult) {
      const categoryMask = segmentationResult?.categoryMask;

      if (!categoryMask || drinkCount === 0) {
        clearPersonRedness();
        return;
      }

      const width = categoryMask.width;
      const height = categoryMask.height;

      if (personRednessSource.width !== width || personRednessSource.height !== height) {
        personRednessSource.width = width;
        personRednessSource.height = height;
      }

      const maskData = categoryMask.getAsUint8Array();
      const detectedPersonCategory = inferPersonMaskCategory(maskData, width, height, faceResult);
      const redImage = personRednessSourceContext.createImageData(width, height);
      const pixels = redImage.data;
      const drinkRatio = Math.min(1, drinkCount / maxDrinkCount);
      const alpha = Math.round(190 + drinkRatio * 60);
      let personTopY = height;
      let personBottomY = -1;

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          if (maskData[y * width + x] === detectedPersonCategory) {
            personTopY = Math.min(personTopY, y);
            personBottomY = Math.max(personBottomY, y);
          }
        }
      }

      if (personBottomY < 0) {
        clearPersonRedness();
        return;
      }

      const personHeight = personBottomY - personTopY + 1;
      const fillStartY = Math.floor(personBottomY - personHeight * drinkRatio);

      for (let y = fillStartY; y <= personBottomY; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const maskIndex = y * width + x;
          if (maskData[maskIndex] !== detectedPersonCategory) {
            continue;
          }

          const pixelIndex = maskIndex * 4;
          pixels[pixelIndex] = 235;
          pixels[pixelIndex + 1] = 24;
          pixels[pixelIndex + 2] = 24;
          pixels[pixelIndex + 3] = alpha;
        }
      }

      personRednessSourceContext.putImageData(redImage, 0, 0);
    }

    function renderWavyRedness(timestamp) {
      const width = personRednessSource.width;
      const height = personRednessSource.height;

      if (!width || !height || !cameraVideo.videoHeight) {
        clearPersonRedness();
        return;
      }

      const sourceScale = height / cameraVideo.videoHeight;
      const scaledPadding = wavePadding * sourceScale;
      const paddedHeight = Math.ceil(height + scaledPadding * 2);
      const actualPadding = (paddedHeight - height) / 2;

      if (personRedness.width !== width || personRedness.height !== paddedHeight) {
        personRedness.width = width;
        personRedness.height = paddedHeight;
      }

      personRedness.style.setProperty('--wave-scale-y', `${paddedHeight / height}`);
      personRednessContext.clearRect(0, 0, width, paddedHeight);

      if (drinkCount === 0) {
        return;
      }

      const drinkRatio = Math.min(1, drinkCount / maxDrinkCount);
      const amplitude = maxWaveAmplitude * drinkRatio * sourceScale;
      const phase = timestamp / 420;
      const sliceWidth = width / waveSliceCount;

      for (let sliceIndex = 0; sliceIndex < waveSliceCount; sliceIndex += 1) {
        const sourceX = sliceIndex * sliceWidth;
        const normalizedX = sliceIndex / waveSliceCount;
        const wave = Math.sin(normalizedX * Math.PI * 2.4 + phase)
          + Math.sin(normalizedX * Math.PI * 4.8 - phase * 0.72) * 0.22;
        const verticalOffset = wave * amplitude;

        personRednessContext.drawImage(
          personRednessSource,
          sourceX,
          0,
          sliceWidth + 1,
          height,
          sourceX,
          actualPadding + verticalOffset,
          sliceWidth + 1,
          height
        );
      }
    }

    function positionShredLayer() {
      const pageRect = page.getBoundingClientRect();
      const frameRect = cameraFrame.getBoundingClientRect();
      const left = frameRect.left - pageRect.left;
      const top = frameRect.top - pageRect.top;
      const width = frameRect.width;
      const height = frameRect.height;
      const sceneRect = shredScene.getBoundingClientRect();
      const shredderTop = Number.parseFloat(window.getComputedStyle(shredder).top) || 0;
      const cutLine = Math.max(0, shredderTop);

      shredIntactClip.style.height = `${cutLine}px`;
      shredSlicesClip.style.top = `${cutLine}px`;
      shredSlicesClip.style.height = `${Math.max(0, sceneRect.height - cutLine)}px`;

      shredIntact.style.left = `${left}px`;
      shredIntact.style.top = `${top}px`;
      shredIntact.style.width = `${width}px`;
      shredIntact.style.height = `${height}px`;

      shredSlices.style.left = `${left}px`;
      shredSlices.style.top = `${top - cutLine}px`;
      shredSlices.style.width = `${width}px`;
      shredSlices.style.height = `${height}px`;

      return { width, height };
    }

    function drawThoughtTextIntoShredSource() {
      if (!thoughtWave.classList.contains('is-visible')) {
        return;
      }

      const frameRect = cameraFrame.getBoundingClientRect();
      const sourceWidth = shredSourceCanvas.width;
      const sourceHeight = shredSourceCanvas.height;

      if (!frameRect.width || !frameRect.height || !sourceWidth || !sourceHeight) {
        return;
      }

      const scaleX = sourceWidth / frameRect.width;
      const scaleY = sourceHeight / frameRect.height;

      // 파쇄 캔버스는 실제 화면과 함께 좌우 반전되어 표시되므로,
      // 텍스트를 한 번 반전해서 그려야 화면에서는 정상 방향으로 보입니다.
      shredSourceContext.save();
      shredSourceContext.translate(sourceWidth, 0);
      shredSourceContext.scale(-1, 1);
      shredSourceContext.textBaseline = 'top';

      thoughtWave.querySelectorAll('.thought-wave-letter').forEach((letter) => {
        const letterRect = letter.getBoundingClientRect();
        const style = window.getComputedStyle(letter);
        const fontSize = Number.parseFloat(style.fontSize) * scaleX;
        const x = (letterRect.left - frameRect.left) * scaleX;
        const y = (letterRect.top - frameRect.top) * scaleY;

        if (!fontSize || !letter.textContent) {
          return;
        }

        shredSourceContext.font = `${style.fontStyle} ${style.fontWeight} ${fontSize}px ${style.fontFamily}`;
        shredSourceContext.fillStyle = style.color;
        shredSourceContext.fillText(letter.textContent, x, y);
      });

      shredSourceContext.restore();
    }

    function captureShredSource() {
      if (!waveCamera.width || !waveCamera.height) {
        return false;
      }

      shredSourceCanvas.width = waveCamera.width;
      shredSourceCanvas.height = waveCamera.height;
      shredSourceContext.clearRect(0, 0, shredSourceCanvas.width, shredSourceCanvas.height);
      shredSourceContext.drawImage(waveCamera, 0, 0);

      // 화면에 보이던 사람 인식 홍조도 캡처본에 곱하기 모드로 합칩니다.
      if (personRedness.width && personRedness.height) {
        shredSourceContext.globalCompositeOperation = 'multiply';
        shredSourceContext.drawImage(
          personRedness,
          0,
          0,
          personRedness.width,
          personRedness.height,
          0,
          0,
          shredSourceCanvas.width,
          shredSourceCanvas.height
        );
        shredSourceContext.globalCompositeOperation = 'source-over';
      }

      // 별도 HTML 레이어인 생각 문구도 캡처본에 합쳐서 함께 파쇄합니다.
      drawThoughtTextIntoShredSource();

      // 캡처가 끝난 뒤에는 뒤에 남은 라이브 화면의 모션 인식을 멈춥니다.
      motionCaptureStopped = true;

      return true;
    }

    function prepareIntactShredImage() {
      shredIntact.width = shredSourceCanvas.width;
      shredIntact.height = shredSourceCanvas.height;
      shredIntactContext.clearRect(0, 0, shredIntact.width, shredIntact.height);
      shredIntactContext.drawImage(shredSourceCanvas, 0, 0);
    }

    function createShredSlices() {
      const frameSize = positionShredLayer();

      if (!captureShredSource()) {
        return false;
      }

      prepareIntactShredImage();
      shredIntact.classList.remove('is-moving');
      shredIntact.style.visibility = 'visible';
      shredSlices.classList.remove('is-visible', 'is-moving');
      shredSlices.style.removeProperty('--screen-distance');
      shredSlices.replaceChildren();
      const sliceCount = 36;
      const sourceSliceWidth = shredSourceCanvas.width / sliceCount;
      const displaySliceWidth = frameSize.width / sliceCount;
      const sliceGap = Math.max(3, Math.min(6, frameSize.width * 0.006));
      const visibleSliceWidth = Math.max(1, displaySliceWidth - sliceGap);
      const sliceScaleY = shredSourceCanvas.height / (cameraVideo.videoHeight || shredSourceCanvas.height);
      const passDuration = 4800;
      const screenDistance = Math.max(window.innerHeight * 1.18, frameSize.height + window.innerHeight * 0.45);
      // 파쇄 조각도 먼저 전체 캡처 화면과 같은 속도로 이동한 뒤 추가로 떨어집니다.
      const sliceDropDelay = passDuration;
      const dropDistance = Math.max(window.innerHeight * 1.18, frameSize.height + window.innerHeight * 0.45);

      shredIntact.style.setProperty('--screen-distance', `${screenDistance}px`);
      shredIntact.style.setProperty('--pass-duration', `${passDuration}ms`);
      shredSlices.style.setProperty('--screen-distance', `${screenDistance}px`);
      shredSlices.style.setProperty('--pass-duration', `${passDuration}ms`);

      for (let sliceIndex = 0; sliceIndex < sliceCount; sliceIndex += 1) {
        const slice = document.createElement('canvas');
        const sliceContext = slice.getContext('2d');
        const canvasWidth = Math.ceil(sourceSliceWidth) + 1;

        slice.width = canvasWidth;
        slice.height = shredSourceCanvas.height;
        sliceContext.drawImage(
          shredSourceCanvas,
          sliceIndex * sourceSliceWidth,
          0,
          sourceSliceWidth + 1,
          shredSourceCanvas.height,
          0,
          0,
          canvasWidth,
          shredSourceCanvas.height
        );

        slice.className = 'shred-slice';
        slice.style.left = `${sliceIndex * displaySliceWidth + sliceGap / 2}px`;
        slice.style.width = `${visibleSliceWidth}px`;
        slice.style.height = `${frameSize.height}px`;
        slice.style.setProperty('--slice-scale-y', sliceScaleY);
        slice.style.setProperty('--drop-distance', `${dropDistance}px`);
        shredSlices.appendChild(slice);
      }

      return { passDuration, sliceDropDelay };
    }

    function startShredderSequence() {
      if (shredderStarted) {
        return;
      }

      const shredMotion = createShredSlices();
      if (!shredMotion) {
        return;
      }

      shredderStarted = true;
      hideGlass();
      cameraFrame.classList.add('is-shredding');
      shredScene.classList.add('is-visible');

      shredSound.currentTime = 0;
      shredSound.play().catch(() => {
        // 브라우저가 오디오를 막아도 파쇄 모션은 계속 진행합니다.
      });

      window.setTimeout(() => {
        shredIntact.classList.add('is-moving');
        shredSlices.classList.add('is-visible', 'is-moving');

        // 기존 파쇄 화면이 약 80% 내려간 뒤, 버튼만 남긴 새 초록색 화면으로 덮습니다.
        window.setTimeout(() => {
          startLateShredStage();
        }, shredMotion.passDuration * 0.8);

        window.setTimeout(() => {
          shredIntact.style.visibility = 'hidden';
        }, shredMotion.passDuration);

        window.setTimeout(() => {
          const slices = [...shredSlices.querySelectorAll('.shred-slice')];
          let finishedSlices = 0;

          const clearFinishedSlices = () => {
            shredSlices.replaceChildren();
            shredSlices.classList.remove('is-visible', 'is-moving');
          };

          slices.forEach((slice) => {
            slice.addEventListener('animationend', () => {
              finishedSlices += 1;
              if (finishedSlices === slices.length) {
                clearFinishedSlices();
              }
            }, { once: true });
            slice.classList.add('is-dropping');
          });

          window.setTimeout(clearFinishedSlices, 4300);
        }, shredMotion.sliceDropDelay);
      }, 1500);
    }

    function registerDrink(faceGeometry) {
      drinkCount = Math.min(maxDrinkCount, drinkCount + 1);
      renderBeerLevel();
      playDrinkSound(drinkCount === maxDrinkCount ? startShredderSequence : undefined);
    }

    function updateDrinkState(isDrinkPose, faceGeometry) {
      if (isDrinkPose) {
        drinkPoseFrames += 1;
        drinkReleaseFrames = 0;

        if (!drinkGestureActive && drinkPoseFrames >= 6) {
          drinkGestureActive = true;
          registerDrink(faceGeometry);
        }
        return;
      }

      drinkPoseFrames = 0;
      drinkReleaseFrames += 1;

      if (drinkReleaseFrames >= 6) {
        drinkGestureActive = false;
      }
    }

    function toFramePoint(landmark) {
      const frameWidth = cameraFrame.clientWidth;
      const frameHeight = cameraFrame.clientHeight;
      const sourceWidth = cameraVideo.videoWidth || frameWidth;
      const sourceHeight = cameraVideo.videoHeight || frameHeight;
      const sourceRatio = sourceWidth / sourceHeight;
      const frameRatio = frameWidth / frameHeight;

      let renderedWidth = frameWidth;
      let renderedHeight = frameHeight;
      let offsetX = 0;
      let offsetY = 0;

      if (sourceRatio > frameRatio) {
        renderedHeight = frameHeight;
        renderedWidth = renderedHeight * sourceRatio;
        offsetX = (frameWidth - renderedWidth) / 2;
      } else {
        renderedWidth = frameWidth;
        renderedHeight = renderedWidth / sourceRatio;
        offsetY = (frameHeight - renderedHeight) / 2;
      }

      return {
        x: (1 - landmark.x) * renderedWidth + offsetX,
        y: landmark.y * renderedHeight + offsetY
      };
    }

    function hideGlass() {
      fistFrameCount = 0;
      glassOverlay.classList.remove('is-visible');
    }

    function isFist(hand) {
      const wrist = hand[0];
      const curledFingerPairs = [
        [8, 6],
        [12, 10],
        [16, 14],
        [20, 18]
      ];

      const curledFingerCount = curledFingerPairs.filter(([tipIndex, pipIndex]) => (
        distance(hand[tipIndex], wrist) <= distance(hand[pipIndex], wrist) * 1.08
      )).length;

      return curledFingerCount >= 3;
    }

    function isMouthInGlassTopArea(mouthPoint, glassCenter, glassWidth, glassHeight, glassRotation, faceWidth) {
      const rotation = glassRotation * Math.PI / 180;
      const deltaX = mouthPoint.x - glassCenter.x;
      const deltaY = mouthPoint.y - glassCenter.y;
      const localX = Math.cos(rotation) * deltaX + Math.sin(rotation) * deltaY;
      const localY = -Math.sin(rotation) * deltaX + Math.cos(rotation) * deltaY;
      const top = -glassHeight / 2;
      const bottom = top + glassHeight * glassDrinkContactRatio;
      const horizontalTolerance = Math.max(14, faceWidth * 0.18);
      const verticalTolerance = Math.max(14, faceWidth * 0.16);

      return localX >= -glassWidth / 2 - horizontalTolerance
        && localX <= glassWidth / 2 + horizontalTolerance
        && localY >= top - verticalTolerance
        && localY <= bottom + verticalTolerance;
    }

    function updateGlass(handResult, faceResult) {
      const face = faceResult.faceLandmarks[0];
      const hasFace = Boolean(face);
      const hand = handResult.landmarks[0];
      const faceGeometry = hasFace ? getFaceGeometry(face) : null;

      if (!hasFace || !hand || !isFist(hand)) {
        hideGlass();
        updateDrinkState(false, faceGeometry);
        return;
      }

      fistFrameCount += 1;
      if (fistFrameCount < 2) {
        return;
      }

      const palm = [hand[0], hand[5], hand[9], hand[13], hand[17]];
      const palmCenter = palm.reduce((center, landmark) => ({
        x: center.x + landmark.x / palm.length,
        y: center.y + landmark.y / palm.length
      }), { x: 0, y: 0 });
      const palmPoint = toFramePoint(palmCenter);
      const indexBasePoint = toFramePoint(hand[5]);
      const pinkyBasePoint = toFramePoint(hand[17]);
      const palmWidth = distance(indexBasePoint, pinkyBasePoint);
      const glassWidth = Math.max(glassMinWidth, Math.min(glassMaxWidth, palmWidth * 1.2 * glassSizeScale));
      const isRightHand = handResult.handednesses?.[0]?.[0]?.categoryName?.toLowerCase() === 'right';
      const handleOffset = isRightHand ? -0.31 : 0.31;
      const wristPoint = toFramePoint(hand[0]);
      const middleBasePoint = toFramePoint(hand[9]);
      const handAngle = Math.atan2(
        middleBasePoint.y - wristPoint.y,
        middleBasePoint.x - wristPoint.x
      ) * 180 / Math.PI;
      const glassRotation = Math.max(-75, Math.min(75, handAngle + 90));
      const glassHeight = glassWidth * (
        (glassSource.naturalHeight || glassSource.naturalWidth) / (glassSource.naturalWidth || 1)
      );
      const glassCenterPoint = {
        x: palmPoint.x + glassWidth * handleOffset,
        y: palmPoint.y + glassWidth * 0.18
      };
      const glassTopIsNearMouth = isMouthInGlassTopArea(
        faceGeometry.mouthPoint,
        glassCenterPoint,
        glassWidth,
        glassHeight,
        glassRotation,
        faceGeometry.width
      );

      glassOverlay.style.left = `${glassCenterPoint.x}px`;
      glassOverlay.style.top = `${glassCenterPoint.y}px`;
      glassOverlay.style.width = `${glassWidth}px`;
      glassOverlay.style.setProperty('--glass-flip', isRightHand ? '-1' : '1');
      glassOverlay.style.setProperty('--glass-rotation', `${glassRotation}deg`);
      glassOverlay.classList.add('is-visible');

      updateDrinkState(glassTopIsNearMouth, faceGeometry);
    }

    async function createVisionTasks() {
      const { FaceLandmarker, FilesetResolver, HandLandmarker, ImageSegmenter } = await import(visionBundleUrl);
      const vision = await FilesetResolver.forVisionTasks(wasmUrl);

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: handModelUrl },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: faceModelUrl },
        runningMode: 'VIDEO',
        numFaces: 1,
        minFaceDetectionConfidence: 0.5,
        minFacePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      imageSegmenter = await ImageSegmenter.createFromOptions(vision, {
        baseOptions: { modelAssetPath: segmenterModelUrl },
        runningMode: 'VIDEO',
        outputCategoryMask: true,
        outputConfidenceMasks: false
      });
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('이 브라우저에서는 카메라를 사용할 수 없습니다.');
      }

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      cameraVideo.srcObject = cameraStream;
      await cameraVideo.play();
    }

    function detectFrame() {
      if (motionCaptureStopped) {
        animationFrameId = null;
        return;
      }

      if (cameraVideo.readyState >= 2 && cameraVideo.currentTime !== lastVideoTime) {
        const timestamp = performance.now();
        const handResult = handLandmarker.detectForVideo(cameraVideo, timestamp);
        const faceResult = faceLandmarker.detectForVideo(cameraVideo, timestamp);
        const segmentationResult = imageSegmenter.segmentForVideo(cameraVideo, timestamp);
        updateGlass(handResult, faceResult);

        if (motionCaptureStopped) {
          segmentationResult.close();
          animationFrameId = null;
          return;
        }

        updatePersonRedness(segmentationResult, faceResult);
        renderWavyCamera(timestamp, segmentationResult, faceResult);
        renderWavyRedness(timestamp);
        segmentationResult.close();
        lastVideoTime = cameraVideo.currentTime;
      }

      if (!motionCaptureStopped) {
        animationFrameId = window.requestAnimationFrame(detectFrame);
      }
    }

    async function initialize() {
      try {
        await createVisionTasks();
        await startCamera();
        setStatus('');
        detectFrame();
      } catch (error) {
        console.error('카메라 또는 얼굴·손 인식 초기화 실패:', error);
        setStatus('카메라 권한을 허용하고 HTTPS 또는 localhost에서 열어주세요.');
      }
    }

    window.addEventListener('beforeunload', () => {
      if (animationFrameId !== null) {
        window.cancelAnimationFrame(animationFrameId);
      }

      cameraStream?.getTracks().forEach((track) => track.stop());
      handLandmarker?.close();
      faceLandmarker?.close();
      imageSegmenter?.close();
    });

    initialize();
  </script>
</body>
</html>
