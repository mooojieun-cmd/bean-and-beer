<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생각 입력</title>

  <style>
    @font-face {
      font-family: 'SlowGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/neurimboGothicRegular.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --green: #43f000;
      
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: #fff;
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      padding: 28px;
      border: 4px solid #e4e4e4;
    }

    .back-button {
      position: absolute;
      top: 28px;
      left: 28px;
      z-index: 20;
      display: block;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .forward-button {
      position: absolute;
      top: 28px;
      right: 28px;
      z-index: 20;
      display: block;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .back-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .back-button:hover {
      transform: scale(1.06);
    }

    .forward-button:hover {
      transform: scale(1.06);
    }

    .back-button:focus-visible,
    .forward-button:focus-visible,
    .thought-input:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

    .input-area {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .result-area {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: 82px 28px 24px;
      background: transparent;
    }

    .green-overlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--green);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease-out;
    }

    .result-area[hidden],
    .input-area[hidden] {
      display: none;
    }

    .result-image-wrap {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 0 12px 20px;
    }

    .result-image {
      display: block;
      width: min(78vw, 1000px);
      max-width: 100%;
      max-height: 66vh;
      height: auto;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transform-origin: center;
      transition: transform 140ms ease-out, opacity 220ms ease;
    }

    .result-image.is-gone {
      opacity: 0;
      pointer-events: none;
    }

    .bean-burst {
      position: absolute;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .s01-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      background: #fff;
    }

    .s01-screen[hidden] {
      display: none;
    }

    .s01-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    .s01-image.is-hidden {
      display: none;
    }

    .falling-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .falling-object {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }

    .falling-ellipse {
      width: 85px;
      height: 54px;
      border-radius: 50%;
      background: #45ef00;
    }

    .falling-bean {
      display: block;
      width: 110px;
      height: auto;
    }

    .bean-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(552px, calc(100vw - 32px));
      aspect-ratio: 552 / 406;
      height: auto;
      opacity: 0;
      animation: beanScatter 1.1s cubic-bezier(0.18, 0.7, 0.25, 1) forwards;
      animation-delay: var(--particle-delay);
      pointer-events: auto;
      cursor: pointer;
    }

    @keyframes beanScatter {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(0deg);
      }

      12% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform:
          translate(
            calc(-50% + var(--particle-x)),
            calc(-50% + var(--particle-y))
          )
          rotate(var(--particle-rotation));
      }
    }

    .result-text {
      position: relative;
      z-index: 1;
      width: 100%;
      margin: 0;
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .thought-input {
      width: min(60vw, 710px);
      min-width: 280px;
      height: 158px;
      padding: 0 44px;
      border: 16px solid var(--green);
      border-radius: 999px;
      background: #fff;
      color: #050505;
      font: inherit;
      font-size: clamp(24px, 3vw, 40px);
      text-align: center;
      caret-color: var(--green);
      pointer-events: auto;
    }

    .thought-input::placeholder {
      color: #B2B2B2;
      opacity: 1;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px;
      }

      .back-button {
        top: 18px;
        left: 18px;
      }

      .forward-button {
        top: 18px;
        right: 18px;
      }

      .thought-input {
        width: min(82vw, 520px);
        height: 112px;
        padding: 0 28px;
        border-width: 11px;
        font-size: clamp(20px, 5vw, 30px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <button class="back-button" type="button" aria-label="이전 페이지로 이동">
      <img src="./button_l.png" alt="">
    </button>

    <button class="forward-button" type="button" aria-label="다음 단계로 이동">
      <img src="./button_r.png" alt="">
    </button>

    <section class="input-area" aria-label="생각 입력 영역">
      <input
        class="thought-input"
        id="thoughtInput"
        name="thought"
        type="text"
        autocomplete="off"
        placeholder="많은 생각 중 하나를 적어보세요"
        aria-label="생각 입력"
      >
    </section>

    <section class="result-area" id="resultArea" aria-label="입력한 생각 결과" hidden>
      <div class="green-overlay" id="greenOverlay" aria-hidden="true"></div>
      <div class="result-image-wrap">
        <img
          class="result-image"
          id="dozenImage"
          src="./dozen.png"
          alt="묶여 있는 풋콩"
          role="button"
          tabindex="0"
          aria-label="풋콩 이미지를 클릭해 보세요"
        >
      </div>
      <p class="result-text">Click the element. . .</p>
      <div class="bean-burst" id="beanBurst" aria-hidden="true"></div>
    </section>

    <section class="s01-screen" id="s01Screen" aria-label="다음 화면" hidden>
      <img class="s01-image" id="s01Image" src="./s01.png" alt="다음 화면을 시작하려면 클릭하세요">
      <div class="falling-layer" id="fallingLayer" aria-hidden="true"></div>
    </section>
  </main>

  <audio id="correctSound" src="sound/correct.mp3" preload="auto"></audio>
  <audio id="correct2Sound" src="sound/correct2.mp3" preload="auto"></audio>
  <audio id="pop1Sound" src="sound/pop1.mp3" preload="auto"></audio>
  <audio id="eatingSound" src="sound/eatingsound.mp3" preload="auto"></audio>
  <audio id="eatingSound2" src="sound/eatingsound2.mp3" preload="auto"></audio>
  <audio id="clickSound" src="sound/click.mp3" preload="auto"></audio>
  <audio id="burstSound" src="sound/2.mp3" preload="auto"></audio>
  <audio id="beanSound" src="sound/beansound.mp3" preload="auto"></audio>

  <script>
    const thoughtInput = document.querySelector('#thoughtInput');
    const backButton = document.querySelector('.back-button');
    const forwardButton = document.querySelector('.forward-button');
    const inputArea = document.querySelector('.input-area');
    const resultArea = document.querySelector('#resultArea');
    const greenOverlay = document.querySelector('#greenOverlay');
    const dozenImage = document.querySelector('#dozenImage');
    const beanBurst = document.querySelector('#beanBurst');
    const s01Screen = document.querySelector('#s01Screen');
    const s01Image = document.querySelector('#s01Image');
    const fallingLayer = document.querySelector('#fallingLayer');
    const correctSound = document.querySelector('#correctSound');
    const correct2Sound = document.querySelector('#correct2Sound');
    const pop1Sound = document.querySelector('#pop1Sound');
    const eatingSound = document.querySelector('#eatingSound');
    const eatingSound2 = document.querySelector('#eatingSound2');
    const clickSound = document.querySelector('#clickSound');
    const burstSound = document.querySelector('#burstSound');
    const beanSound = document.querySelector('#beanSound');
    const storageKey = 'thought-text';
    const clickRotations = [-4, 3, -6, 4, -3, 5, -5, 2, -4, 6, -2, 4];
    let dozenClickCount = 0;
    let burstStarted = false;
    let resultTransitionTimer = null;
    let resultTransitionPending = false;
    let beanTransitionTimer = null;
    let beanTransitionPending = false;
    let beanInteractionReady = false;
    let fallingStarted = false;
    let fallingAnimationFrame = null;
    let fallingObjects = [];
    const greenOpacityStep = 0.2;

    // 이전에 입력한 내용을 다시 불러옵니다.
    thoughtInput.value = localStorage.getItem(storageKey) || '';

    // 입력 내용은 다음 페이지에서 사용할 수 있도록 저장합니다.
    thoughtInput.addEventListener('input', () => {
      localStorage.setItem(storageKey, thoughtInput.value);
    });

    // 다른 페이지에서 window.getThoughtText()로 현재 입력값을 읽을 수 있습니다.
    window.getThoughtText = () => thoughtInput.value;

    function clearFallingStage() {
      if (fallingAnimationFrame !== null) {
        window.cancelAnimationFrame(fallingAnimationFrame);
        fallingAnimationFrame = null;
      }

      fallingStarted = false;
      fallingObjects = [];
      fallingLayer.replaceChildren();
      s01Image.classList.remove('is-hidden');
    }

    function showDozenStage() {
      if (beanTransitionTimer !== null) {
        window.clearTimeout(beanTransitionTimer);
        beanTransitionTimer = null;
      }

      beanTransitionPending = false;
      beanInteractionReady = false;
      clearFallingStage();
      s01Screen.hidden = true;
      inputArea.hidden = true;
      resultArea.hidden = false;
      burstStarted = false;
      dozenClickCount = 0;
      dozenImage.classList.remove('is-gone');
      dozenImage.style.transform = 'rotate(0deg)';
      beanBurst.replaceChildren();
      beanBurst.hidden = false;
      greenOverlay.style.opacity = '0';
      burstSound.pause();
      burstSound.currentTime = 0;
      beanSound.pause();
      beanSound.currentTime = 0;
    }

    function showS01Stage() {
      if (beanTransitionTimer !== null) {
        window.clearTimeout(beanTransitionTimer);
        beanTransitionTimer = null;
      }

      beanTransitionPending = false;
      beanInteractionReady = false;
      clearFallingStage();
      beanBurst.hidden = true;
      inputArea.hidden = true;
      resultArea.hidden = true;
      s01Screen.hidden = false;
      s01Image.classList.remove('is-hidden');
      burstSound.pause();
      burstSound.currentTime = 0;
      beanSound.pause();
      beanSound.currentTime = 0;
    }

    function showResult() {
      const text = thoughtInput.value.trim();

      if (!text) {
        return;
      }

      if (resultTransitionPending) {
        return;
      }

      localStorage.setItem(storageKey, text);
      resultTransitionPending = true;
      correctSound.currentTime = 0;
      correctSound.play().catch((error) => {
        console.error('sound/correct.mp3 재생 실패:', error);
      });

      resultTransitionTimer = window.setTimeout(() => {
        inputArea.hidden = true;
        resultArea.hidden = false;
        resultTransitionPending = false;
        resultTransitionTimer = null;
      }, 1000);
    }

    function showInput() {
      if (resultTransitionTimer !== null) {
        window.clearTimeout(resultTransitionTimer);
        resultTransitionTimer = null;
      }

      if (beanTransitionTimer !== null) {
        window.clearTimeout(beanTransitionTimer);
        beanTransitionTimer = null;
      }

      resultTransitionPending = false;
      beanTransitionPending = false;
      clearFallingStage();
      resultArea.hidden = true;
      inputArea.hidden = false;
      s01Screen.hidden = true;
      s01Image.classList.remove('is-hidden');
      dozenClickCount = 0;
      burstStarted = false;
      dozenImage.classList.remove('is-gone');
      dozenImage.style.transform = 'rotate(0deg)';
      greenOverlay.style.opacity = '0';
      beanBurst.replaceChildren();
      beanBurst.hidden = false;
      fallingLayer.replaceChildren();
      correctSound.pause();
      correctSound.currentTime = 0;
      correct2Sound.pause();
      correct2Sound.currentTime = 0;
      pop1Sound.pause();
      pop1Sound.currentTime = 0;
      eatingSound.pause();
      eatingSound.currentTime = 0;
      eatingSound2.pause();
      eatingSound2.currentTime = 0;
      clickSound.pause();
      clickSound.currentTime = 0;
      burstSound.pause();
      burstSound.currentTime = 0;
      beanSound.pause();
      beanSound.currentTime = 0;
      thoughtInput.focus();
    }

    function createBeanBurst() {
      const particleCount = 24;
      const distanceBase = Math.max(window.innerWidth, window.innerHeight) * 0.52;
      let completedParticles = 0;

      beanInteractionReady = false;

      for (let index = 0; index < particleCount; index += 1) {
        const angle = (Math.PI * 2 * index) / particleCount + (Math.random() - 0.5) * 0.28;
        const distance = distanceBase * (0.7 + Math.random() * 0.65);
        const particle = document.createElement('img');

        particle.className = 'bean-particle';
        particle.src = './bean1.png';
        particle.alt = '';
        particle.style.setProperty('--particle-x', `${Math.cos(angle) * distance}px`);
        particle.style.setProperty('--particle-y', `${Math.sin(angle) * distance}px`);
        particle.style.setProperty('--particle-rotation', `${Math.round(Math.random() * 360 - 180)}deg`);
        particle.style.setProperty('--particle-delay', `${(Math.random() * 0.12).toFixed(2)}s`);
        particle.addEventListener('click', activateBeanParticle);
        particle.addEventListener('animationend', () => {
          completedParticles += 1;

          if (completedParticles === particleCount) {
            beanInteractionReady = true;
          }
        }, { once: true });
        beanBurst.appendChild(particle);
      }
    }

    function activateBeanParticle() {
      if (beanTransitionPending || !burstStarted || !beanInteractionReady) {
        return;
      }

      beanTransitionPending = true;
      correct2Sound.currentTime = 0;
      correct2Sound.play().catch((error) => {
        console.error('sound/correct2.mp3 재생 실패:', error);
      });

      beanTransitionTimer = window.setTimeout(() => {
        beanBurst.hidden = true;
        s01Screen.hidden = false;
        beanTransitionPending = false;
        beanTransitionTimer = null;
      }, 1000);
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function removeFallingObject(fallingObject) {
      if (fallingObject.removed) {
        return;
      }

      fallingObject.removed = true;
      const eatingAudio = Math.random() < 0.5 ? eatingSound : eatingSound2;

      eatingAudio.currentTime = 0;
      eatingAudio.play().catch((error) => {
        console.error('eating sound 재생 실패:', error);
      });
      fallingObject.element.remove();
    }

    function startFallingObjects() {
      if (fallingStarted) {
        return;
      }

      fallingStarted = true;
      s01Image.classList.add('is-hidden');
      pop1Sound.currentTime = 0;
      pop1Sound.play().catch((error) => {
        console.error('sound/pop1.mp3 재생 실패:', error);
      });
      const objectCount = 28;
      const screenWidth = s01Screen.clientWidth;
      const screenHeight = s01Screen.clientHeight;
      const startedAt = performance.now();

      fallingObjects = [];

      for (let index = 0; index < objectCount; index += 1) {
        const isBean = index % 3 === 0;
        const object = isBean
          ? document.createElement('img')
          : document.createElement('div');
        const objectWidth = isBean ? 110 : 85;
        const startX = randomBetween(-20, Math.max(0, screenWidth - objectWidth));
        const endX = Math.min(
          Math.max(0, startX + randomBetween(-180, 180)),
          Math.max(0, screenWidth - objectWidth)
        );
        const objectHeight = isBean ? 73 : 54;

        object.className = `falling-object ${isBean ? 'falling-bean' : 'falling-ellipse'}`;

        if (isBean) {
          object.src = './bean.png';
          object.alt = '';
        }

        const fallingObject = {
          element: object,
          x: startX,
          y: randomBetween(-420, -70),
          vx: randomBetween(-90, 90),
          vy: randomBetween(40, 140),
          rotation: randomBetween(-30, 30),
          angularVelocity: randomBetween(-120, 120),
          gravity: randomBetween(1450, 1750),
          restitution: randomBetween(0.28, 0.42),
          floorY: screenHeight - objectHeight,
          startAt: startedAt + randomBetween(0, 1100),
          lastTime: null,
          bounceCount: 0,
          settled: false,
          removed: false
        };

        object.addEventListener('click', () => {
          removeFallingObject(fallingObject);
        });
        fallingObjects.push(fallingObject);
        fallingLayer.appendChild(object);
      }

      fallingAnimationFrame = window.requestAnimationFrame(animateFallingObjects);
    }

    function animateFallingObjects(timestamp) {
      let activeObjects = false;
      const screenWidth = s01Screen.clientWidth;

      fallingObjects.forEach((fallingObject) => {
        if (fallingObject.settled || fallingObject.removed) {
          return;
        }

        activeObjects = true;

        if (timestamp < fallingObject.startAt) {
          fallingObject.element.style.opacity = '0';
          return;
        }

        if (fallingObject.lastTime === null) {
          fallingObject.lastTime = timestamp;
          fallingObject.element.style.opacity = '1';
          fallingObject.element.style.transform = `translate3d(${fallingObject.x}px, ${fallingObject.y}px, 0) rotate(${fallingObject.rotation}deg)`;
          return;
        }

        const deltaTime = Math.min((timestamp - fallingObject.lastTime) / 1000, 0.032);
        fallingObject.lastTime = timestamp;
        fallingObject.vy += fallingObject.gravity * deltaTime;
        fallingObject.x += fallingObject.vx * deltaTime;
        fallingObject.y += fallingObject.vy * deltaTime;
        fallingObject.rotation += fallingObject.angularVelocity * deltaTime;

        if (fallingObject.x < 0 || fallingObject.x > screenWidth - fallingObject.element.offsetWidth) {
          fallingObject.x = Math.min(
            Math.max(0, fallingObject.x),
            Math.max(0, screenWidth - fallingObject.element.offsetWidth)
          );
          fallingObject.vx *= -0.45;
        }

        if (fallingObject.y >= fallingObject.floorY) {
          fallingObject.y = fallingObject.floorY;

          if (Math.abs(fallingObject.vy) > 70 && fallingObject.bounceCount < 4) {
            fallingObject.vy = -fallingObject.vy * fallingObject.restitution;
            fallingObject.vx *= 0.72;
            fallingObject.angularVelocity *= 0.7;
            fallingObject.bounceCount += 1;
          } else {
            fallingObject.vy = 0;
            fallingObject.vx *= Math.pow(0.14, deltaTime);
            fallingObject.angularVelocity *= Math.pow(0.08, deltaTime);

            if (Math.abs(fallingObject.vx) < 2 && Math.abs(fallingObject.angularVelocity) < 3) {
              fallingObject.vx = 0;
              fallingObject.angularVelocity = 0;
              fallingObject.settled = true;
            }
          }
        }

        fallingObject.element.style.opacity = '1';
        fallingObject.element.style.transform = `translate3d(${fallingObject.x}px, ${fallingObject.y}px, 0) rotate(${fallingObject.rotation}deg)`;
      });

      if (activeObjects) {
        fallingAnimationFrame = window.requestAnimationFrame(animateFallingObjects);
      } else {
        fallingAnimationFrame = null;
      }
    }

    function activateDozen() {
      if (burstStarted) {
        return;
      }

      clickSound.currentTime = 0;
      clickSound.play().catch((error) => {
        console.error('sound/click.mp3 재생 실패:', error);
      });

      dozenClickCount += 1;
      const rotation = clickRotations[dozenClickCount - 1];
      dozenImage.style.transform = `rotate(${rotation}deg)`;
      greenOverlay.style.opacity = `${Math.min(dozenClickCount * greenOpacityStep, 1)}`;

      if (dozenClickCount < 12) {
        return;
      }

      burstStarted = true;
      dozenImage.classList.add('is-gone');
      burstSound.currentTime = 0;
      burstSound.play().catch((error) => {
        console.error('sound/2.mp3 재생 실패:', error);
      });
      beanSound.currentTime = 0;
      beanSound.play().catch((error) => {
        console.error('sound/beansound.mp3 재생 실패:', error);
      });
      createBeanBurst();
    }

    dozenImage.addEventListener('click', activateDozen);

    dozenImage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        activateDozen();
      }
    });

    s01Image.addEventListener('click', startFallingObjects);

    forwardButton.addEventListener('click', () => {
      if (!inputArea.hidden) {
        showResult();
        return;
      }

      if (!s01Screen.hidden) {
        if (!fallingStarted) {
          startFallingObjects();
        }
        return;
      }

      if (!resultArea.hidden) {
        showS01Stage();
      }
    });

    thoughtInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        showResult();
      }
    });

    backButton.addEventListener('click', () => {
      if (!s01Screen.hidden) {
        if (fallingStarted) {
          clearFallingStage();
          return;
        }

        showDozenStage();
        return;
      }

      if (!resultArea.hidden) {
        showInput();
        return;
      }

      if (window.history.length > 1) {
        window.history.back();
      }
    });
  </script>
</body>
</html>
