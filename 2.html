<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>맥주</title>
  <style>
    @font-face {
      font-family: 'SlowGothic';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-01@1.0/neurimboGothicRegular.woff2') format('woff2');
      font-weight: normal;
      font-display: swap;
    }

    :root {
      --green: #43f000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #fff;
      color: #050505;
      font-family: 'SlowGothic', sans-serif;
    }

    .page {
      position: relative;
      display: grid;
      min-height: 100vh;
      padding: 28px;
      border: 4px solid #e4e4e4;
      place-items: center;
      overflow: hidden;
    }

    .nav-button {
      position: absolute;
      top: 28px;
      z-index: 10;
      display: block;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav-button.left {
      left: 28px;
    }

    .nav-button.right {
      right: 28px;
    }

    .nav-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nav-button:hover {
      transform: scale(1.06);
    }

    .nav-button:focus-visible {
      outline: 3px solid #111;
      outline-offset: 4px;
    }

    .can-stage {
      position: relative;
      display: grid;
      width: min(63.25vw, 850px, 94.3vh);
      height: min(63.25vw, 850px, 94.3vh);
      place-items: center;
    }

    .can-circle {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 50%;
      background: var(--green);
      transform: scale(1);
      transform-origin: center;
      transition: transform 680ms cubic-bezier(0.22, 0.8, 0.26, 1);
      will-change: transform;
    }

    .can-stage.is-shrunk .can-circle {
      transform: scale(0.58);
    }

    .can-image {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 1;
      display: block;
      width: auto;
      height: min(115vh, 690px);
      max-width: 78%;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 680ms cubic-bezier(0.22, 0.8, 0.26, 1), opacity 220ms ease;
      transform: translate(-50%, -50%);
      transform-origin: center;
      will-change: transform, opacity;
    }

    .can-stage.is-shrunk .can-image {
      transform: translate(-50%, -50%) scale(1.07);
    }

    .can-stage.is-complete .can-circle,
    .can-stage.is-complete .can-image {
      opacity: 0;
      pointer-events: none;
    }

    .can-close-image {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      display: block;
      width: min(78vw, 840px);
      max-height: 78vh;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 260ms ease, transform 600ms ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .can-close-image.is-visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }

    .can-close-image.is-rotating {
      transform: translate(-50%, -50%) rotate(-90deg);
    }

    .beer-gif-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      width: 100vw;
      height: 100vh;
      background: #fff;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .beer-gif-screen.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .beer-gif-screen img {
      display: block;
      width: min(1500px, 100vw);
      max-width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px;
      }

      .nav-button {
        top: 18px;
      }

      .nav-button.left {
        left: 18px;
      }

      .nav-button.right {
        right: 18px;
      }

      .can-stage {
        width: min(94.3vw, 94.3vh);
        height: min(94.3vw, 94.3vh);
      }

      .can-image {
        height: min(76vh, 495px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <button class="nav-button left" type="button" aria-label="낙하 화면으로 돌아가기">
      <img src="./button_l.png" alt="">
    </button>

    <button class="nav-button right" type="button" aria-label="다음 페이지로 이동">
      <img src="./button_r.png" alt="">
    </button>

    <section class="can-stage" aria-label="맥주 캔">
      <div class="can-circle" aria-hidden="true"></div>
      <img class="can-image" src="./beer/can1.png" alt="맥주 캔">
    </section>

    <img class="can-close-image" src="./beer/canclose.png" alt="캔 뚜껑 확대 이미지" role="button" tabindex="0">

    <div class="beer-gif-screen" id="beerGifScreen" aria-hidden="true">
      <img id="beerGifImage" src="./beer/beer111.gif" alt="맥주 애니메이션">
    </div>
  </main>

  <audio id="openSound" src="sound/open.mp3" preload="auto"></audio>
  <audio id="p1Sound" src="sound/p1.mp3" preload="auto"></audio>
  <audio id="sodaFizzingSound" src="sound/soda-fizzing.mp3" preload="auto"></audio>
  <audio id="canCloseSound" src="sound/5.mp3" preload="auto"></audio>

  <script>
    const canStage = document.querySelector('.can-stage');
    const canImage = document.querySelector('.can-image');
    const canCloseImage = document.querySelector('.can-close-image');
    const beerGifScreen = document.querySelector('#beerGifScreen');
    const beerGifImage = document.querySelector('#beerGifImage');
    const openSound = document.querySelector('#openSound');
    const p1Sound = document.querySelector('#p1Sound');
    const sodaFizzingSound = document.querySelector('#sodaFizzingSound');
    const canCloseSound = document.querySelector('#canCloseSound');
    const beerGifDuration = 11840;
    const canCloseRotationDuration = 600;
    const delayAfterCanCloseSound = 700;
    let canClickStarted = false;
    let canCloseClickStarted = false;

    document.querySelector('.nav-button.left').addEventListener('click', () => {
      window.location.href = './1.html?stage=falling';
    });

    document.querySelector('.nav-button.right').addEventListener('click', () => {
      window.location.href = './3.html';
    });

    canImage.addEventListener('click', () => {
      if (canClickStarted) {
        return;
      }

      canClickStarted = true;
      canStage.classList.add('is-shrunk');
      openSound.currentTime = 0;
      openSound.play().catch((error) => {
        console.error('sound/open.mp3 재생 실패:', error);
      });

      window.setTimeout(() => {
        canStage.classList.add('is-complete');

        window.setTimeout(() => {
          canCloseImage.classList.add('is-visible');
        }, 500);
      }, 680);
    });

    canCloseImage.addEventListener('click', () => {
      if (!canCloseImage.classList.contains('is-visible') || canCloseClickStarted) {
        return;
      }

      canCloseClickStarted = true;
      canCloseImage.classList.add('is-rotating');

      const showBeerGif = () => {
        beerGifScreen.classList.add('is-visible');

        beerGifImage.addEventListener('load', () => {
          window.setTimeout(() => {
            // GIF가 끝난 뒤 바로 3.html의 슬라이드인 화면으로 넘어갑니다.
            // GIF 레이어를 투명하게 만들지 않아 canclose.png가 다시 노출되지 않습니다.
            window.location.href = './3.html?enter=slide';
          }, beerGifDuration);
        }, { once: true });

        // 같은 GIF를 다시 재생할 수 있도록 클릭 순간에 새 URL로 불러옵니다.
        beerGifImage.src = `./beer/beer111.gif?play=${Date.now()}`;
        p1Sound.currentTime = 0;
        p1Sound.play().catch((error) => {
          console.error('sound/p1.mp3 재생 실패:', error);
        });

        window.setTimeout(() => {
          sodaFizzingSound.currentTime = 0;
          sodaFizzingSound.play().catch((error) => {
            console.error('sound/soda-fizzing.mp3 재생 실패:', error);
          });
        }, 1000);
      };

      canCloseSound.addEventListener('ended', () => {
        window.setTimeout(showBeerGif, delayAfterCanCloseSound);
      }, { once: true });
      canCloseSound.currentTime = 0;
      canCloseSound.play().catch((error) => {
        console.error('sound/5.mp3 재생 실패:', error);
        // 오디오 재생이 차단된 경우에도 화면 전환이 멈추지 않도록 합니다.
        window.setTimeout(showBeerGif, canCloseRotationDuration + delayAfterCanCloseSound);
      });
    });

    canCloseImage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        canCloseImage.click();
      }
    });
  </script>
</body>
</html>
